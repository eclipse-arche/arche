analyzer:
  enabled_package_managers:
  - "GradleInspector"
resolutions:
  issues:
  - message: "IOException: Could not resolve provenance for package 'Maven:com.jetbrains:mps:2024.1.3'.*"
    reason: "BUILD_TOOL_ISSUE"
    comment: "MPS does not provide source artifacts."
curations:
  license_findings:
    - path: "LICENSE"
      start_lines: 1
      line_count: 277
      detected_license: "EPL-2.0"
      concluded_license: "NONE"
      reason: "INCORRECT"
      comment: "This is the license for the product itself."