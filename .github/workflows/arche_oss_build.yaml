name: CI MPS Build

on:
  push:
    branches:
      - main
      - develop
      - 'maintenance/*'
  pull_request:
    branches:
      - main
      - develop
      - 'maintenance/*'
  workflow_dispatch:

jobs:
  build_platform:
    name: Build Platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
          
    - name: Build
      run: |
          xvfb-run ./gradlew --console=plain --info --stacktrace

    - name: Verify uncommitted changes
      run: |
        if [[ -n $(git status --porcelain | head --lines=1) ]]
        then          
          echo "Uncommitted changes detected after build, run './gradlew' and/or update .gitignore to fix:"
          git status
          echo ">>>>>>>>>>>>>>>>>>>>>"
          git diff
          echo "<<<<<<<<<<<<<<<<<<<<<"
          exit 1
        fi

    - name: Archive distribution
      uses: actions/upload-artifact@v4
      with:
        name: org.eclipse.arche.platform
        path: build/artifacts/org.eclipse.arche.platform/

    - name: Report build_platform status check
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const state = '${{ job.status }}' === 'success' ? 'success' : 'failure'
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: state,
            context: 'build_platform',
            description: `Build completed with status: ${{ job.status }}`
          })


